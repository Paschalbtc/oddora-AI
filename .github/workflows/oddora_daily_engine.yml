name: Oddora AI Autonomous Daily Engine

on:
  schedule:
    # 6:00 AM UTC daily -> Morning Ingest & Predict
    - cron: '0 6 * * *'
    # 12:00 AM (Midnight) UTC daily -> Midnight Autopsy & Vector Memory
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Select engine job to execute manually'
        required: true
        default: 'morning'
        type: choice
        options:
          - 'morning'
          - 'midnight'
          - 'both'

jobs:
  run-engine:
    name: Execute Oddora AI Quantitative Engine
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Ingest & Predict (06:00 UTC)
        if: |
          github.event.schedule == '0 6 * * *' ||
          github.event.inputs.job_type == 'morning' ||
          github.event.inputs.job_type == 'both'
        run: |
          echo "=========================================================="
          echo "🚀 Executing Oddora AI Morning Ingest & Predict Engine"
          echo "=========================================================="
          python morning_ingest_and_predict.py

      - name: Run Midnight Autopsy & Self-Learning (00:00 UTC)
        if: |
          github.event.schedule == '0 0 * * *' ||
          github.event.inputs.job_type == 'midnight' ||
          github.event.inputs.job_type == 'both'
        run: |
          echo "=========================================================="
          echo "🔬 Executing Oddora AI Midnight Autopsy & Memory Engine"
          echo "=========================================================="
          python midnight_autopsy.py

